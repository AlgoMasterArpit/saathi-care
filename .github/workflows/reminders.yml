name: Reminder heartbeat

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder tick
        env:
          SAATHI_URL: ${{ vars.SAATHI_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SAATHI_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SAATHI_URL or CRON_SECRET not configured; skipping"
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 --retry 2 \
            -X POST -H "x-cron-secret: ${CRON_SECRET}" "${SAATHI_URL}/api/cron/tick"
